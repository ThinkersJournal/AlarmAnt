# cargo-deny configuration (same shape as the portfolio's other Rust repositories).
# Read the job log: an advisory acknowledgement is the PM's call at gate, never a config edit.
[graph]
all-features = true

[advisories]
version = 2
# RUSTSEC-2026-0543 (chrono 0.4.45 unmaintained, no safe upgrade): a maintenance advisory, not a vulnerability. chrono arrives only
# through synapsed-client rc.266 -> synapse-security/synapse -> auto-discovery 0.3.3; no AlarmAnt code or dependency uses it. EXPIRES 2026-12-17
# (CireSnave's standing OK of 2026-11-18, EXPECTATIONS 6.15b; PM ruling A for this PR 2026-11-25): re-check then, do not extend without a new
# decision. Exit: the ROADMAP row A14 (the root fix is upstream); remove this entry when chrono is out of Cargo.lock. Gate commit by pm-assist.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no safe upgrade; maintenance advisory, not a vulnerability; arrives only via synapsed-client rc.266; expires 2026-12-17; exit = ROADMAP row A14" },
]

[licenses]
version = 2
# Allow list, read from `cargo deny list`: a new dependency whose licence expression cannot be
# satisfied from these fails the job. Dual-licensed crates (jiff, r-efi, rustix, the objc2 family)
# are satisfied by their MIT or Apache-2.0 arm; Unicode-3.0 is the ICU data and unicode-ident.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # The TLS/crypto stack under reqwest (ring, rustls-webpki, aws-lc-*): all permissive.
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
