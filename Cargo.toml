[package]
name = "alarmant"
version = "0.2.2"
edition = "2024"
description = "An emergency alert that cannot be ignored: escalation state machine (A5). Android app and senders not yet built."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/AlarmAnt"
readme = "README.md"
exclude = ["android/"]

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
httpant-client = { version = "0.7.5", features = ["https"] }
httpant-server = "0.7.5"
persistant = "0.17.12"
ring = "0.17.14"
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
