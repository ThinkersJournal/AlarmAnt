[package]
name = "alarmant"
version = "0.4.3"
edition = "2024"
description = "An emergency alert that cannot be ignored: escalation state machine (A5). Android app and senders not yet built."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/AlarmAnt"
readme = "README.md"
exclude = ["android/"]

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
httpant-client = { version = "0.7.10", features = ["https"] }
httpant-server = { version = "0.7.10", features = ["tls"] }
persistant = "0.17.12"
rcgen = "0.14.10"
ring = "0.17.14"
serde_json = "1"
synapsed-client = "6.0.0-rc.266"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
